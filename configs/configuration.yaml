
# Настройки источника видеопотока
camera:
  id: "cam_01"
  source: "data/ppe_test.mp4"
  reconnect_sec: 2

# Настройки нейросетевых моделей
models:
  detector_path: "yolo26n.pt"
  person_confidence: 0.35
  fire_confidence: 0.65
  image_size: 640

# Контролируемые зоны
zones:
  restricted_01:
    - [0.30, 0.45]
    - [0.98, 0.45]
    - [0.95, 0.90]
    - [0.10, 0.90]

# Настройки формирования событий
events:
  confirmation_n: 3
  confirmation_m: 5
  cooldown_sec: 10

# Настройки хранения событий
storage:
  root: "events"
  retention_days: 30

ppe:
  model_path: "runs/ppe/experiment_01/weights/best.pt"
  confidence: 0.35
  min_person_height: 120
  confirmation_sec: 3.0

fire_smoke:
  model_path: "models/fire_smoke/best.pt"
  confidence: 0.35
  image_size: 640
  confirmation_sec: 3.0

event_engine:
  output_dir: "output"
  save_evidence: true

spills:
  model_path: "runs/spills/experiment_01/weights/best.pt"
  confidence: 0.35
  image_size: 640
  confirmation_sec: 3.0